<main>

    <!-- BANNER -->
    <section id="section-banner">
        <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="img/hero-1.jpg" class="d-block w-100" alt="CONSOLE PS5">
                </div>
                <div class="carousel-item">
                    <img src="img/hero-2.jpg" class="d-block w-100" alt="KIT GAMER">
                </div>
                <div class="carousel-item">
                    <img src="img/hero-3.jpg" class="d-block w-100" alt="MONITOR">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </section>

    <!-- Encabezado Centrado -->
    <div class="titles-container">
        <h3><strong>SELEÇÃO DA SEMANA</strong></h3>
        <h2>OS MAIS VENDIDOS</h2>
    </div>

    <!-- Contenedor Responsive Fijo -->
    <div class="cards-container">

        <!-- CARD 1 -->
        <mat-card class="example-card" *ngFor="let produto of produtos">
            <img mat-card-image src="img/{{produto.foto}}" alt="MOUSE">

            <mat-card-header>
                <mat-card-title>{{produto.produto}}</mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <p>{{produto.descricao}}</p>
                <p class="preço">{{produto.preco | currency : 'BRL'}}</p>
            </mat-card-content>

            <mat-card-actions>
                <button class="button-card">COMPRAR</button>
            </mat-card-actions>
        </mat-card>

    </div>
</main>
